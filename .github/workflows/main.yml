name: Compile with Metal Toolchain

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-shaders:
    # Uses the runner targeted for Xcode 27 environments
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Xcode 27.0 version
        run: |
          # By default, this runner targets Xcode 27.1.
          # This command explicitly switches the active path to Xcode 27.0.
          sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          xcodebuild -version

      - name: Create Temporary Test Shader
        run: |
          # Create the src directory and generate a valid dummy shader code
          mkdir -p src
          cat << 'EOF' > src/Shaders.metal
          #include <metal_stdlib>
          using namespace metal;
          kernel void test_shader(device float *out [[buffer(0)]], uint id [[thread_position_in_grid]]) {
              out[id] = 1.0f;
          }
          EOF
      - name: Compile Metal Shaders
        run: |
          mkdir -p build
          xcrun -sdk macosx metal -O3 src/Shaders.metal -o build/default.metallib
      - name: Upload Shaders Artifact
        uses: actions/upload-artifact@v4
        with:
          name: metal-library
          path: build/default.metallib
