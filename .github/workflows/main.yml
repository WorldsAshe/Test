name: Node Compile Cache Test

on: [push, workflow_dispatch]

jobs:
  test-cache:
    runs-on: ubuntu-24.04 # En attendant la disponibilité générale d'ubuntu-26.04
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Le cache natif requiert Node.js v22 ou plus récent

      - name: Run Node with Compile Cache Debug
        run: |
          NODE_DEBUG_NATIVE=COMPILE_CACHE \
          NODE_COMPILE_CACHE=/tmp/node-compile-cache \
          node -p "require('node:module').enableCompileCache(); require('node:module').getCompileCacheDir()"
