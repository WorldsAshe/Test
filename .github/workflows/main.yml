name: Diagnostic - Verify Live APT Configuration

on:
  workflow_dispatch: # Allows manual execution from the GitHub Actions UI

jobs:
  diagnose-runner:
    runs-on: ubuntu-22.04 # Target the runner image you want to audit
    steps:
      - name: 1. Verify Active Configuration File
        run: |
          echo "=== Inspecting /etc/apt/apt.conf.d/99bad_proxy ==="
          if [ -f /etc/apt/apt.conf.d/99bad_proxy ]; then
            cat -n /etc/apt/apt.conf.d/99bad_proxy
          else
            echo "File 99bad_proxy does not exist on this image."
          fi

      - name: 2. Check Active APT Version
        run: |
          echo "=== Checking Installed APT Binary Version ==="
          apt --version
          echo "Claim: Version 2.4+ natively fixes legacy redirector bugs."

      - name: 3. Verify if BrokenProxy is Recognized by APT
        run: |
          echo "=== Querying APT Configuration for BrokenProxy ==="
          # If this returns empty, APT source code no longer reads or tracks this key
          apt-config dump | grep -i "BrokenProxy" || echo "BrokenProxy is not recognized by this APT version."

      - name: 4. Sniff Outgoing Cache-Control Network Headers
        run: |
          echo "=== Intercepting Outgoing HTTP Headers during Update ==="
          # Triggers a real update using APT network debug mode to inspect outgoing headers
          sudo apt-get update -o Debug::Acquire::http=true 2>&1 | grep -E "Cache-Control|Pragma" || echo "No explicit headers caught."
          echo "Analysis: If 'no-cache' is visible, the proxy cache is being defeated."
