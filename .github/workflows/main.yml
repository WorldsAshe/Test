name: Watch what APT sends to the network

on:
  workflow_dispatch: 

jobs:
  check-system:
    runs-on: ubuntu-22.04
    steps:    
      - name: Delete obsolete APT proxy lines
        run: |
          echo "=== Removing legacy proxy settings ==="
          if [ -f /etc/apt/apt.conf.d/99bad_proxy ]; then
            # Completely remove the file containing the obsolete PR #4368 changes
            sudo rm -f /etc/apt/apt.conf.d/99bad_proxy
            echo "Deletion complete: 99bad_proxy has been removed."
          else
            echo "99bad_proxy file not found, nothing to delete."
          fi
      
      - name: Check 1 — Watch what APT sends to the network
        run: |
          echo "=== Catching outgoing HTTP headers ==="
          sudo apt-get update -o Debug::Acquire::http=true 2>&1 | grep -E "Cache-Control|Pragma" || echo "No network headers captured."
          # SUCCESS LOOKS LIKE: You see 'Cache-Control: max-age=0' (Safe revalidation).
          # FAILURE LOOKS LIKE: You see 'Cache-Control: no-cache' (This breaks proxy servers).
