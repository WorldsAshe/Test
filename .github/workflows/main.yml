name: Watch what APT sends to the network

on:
  workflow_dispatch:

jobs:
  check-system:
    runs-on: ubuntu-22.04
    steps:    
      - name: Delete obsolete PR #4368 APT settings
        run: |
          echo "=== Removing all legacy PR #4368 HTTP header modifications ==="
          
          # Direct removal of all PR #4368 configuration lines across all apt config files
          sudo sed -i '/Acquire::http::Pipeline-Depth/d' /etc/apt/apt.conf.d/*
          sudo sed -i '/Acquire::http::Cache-Control/d' /etc/apt/apt.conf.d/*
          sudo sed -i '/Acquire::http::User-Agent/d' /etc/apt/apt.conf.d/*
          
          # Direct removal of the legacy proxy file
          sudo rm -f /etc/apt/apt.conf.d/99bad_proxy
          
          echo "Deletion complete."
      
      - name: Watch what APT sends to the network
        run: |
          echo "=== Catching outgoing HTTP headers ==="
          sudo apt-get update -o Debug::Acquire::http=true 2>&1 | grep -E "Cache-Control|Pragma" || echo "No network headers captured."
          # Success looks Like: You see 'Cache-Control: max-age=0' (Safe revalidation).
          # Failure looks Like: You see 'Cache-Control: no-cache' (This breaks proxy servers).
