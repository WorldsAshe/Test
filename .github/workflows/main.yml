name: Node Compile Cache Test

on: [workflow_dispatch]

jobs:
  test-cache:
    runs-on: ubuntu-26.04 
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' 

      - name: Run Node with Compile Cache Debug
        run: |
          NODE_DEBUG_NATIVE=COMPILE_CACHE \
          NODE_COMPILE_CACHE=/tmp/node-compile-cache \
          node -p "require('node:module').enableCompileCache(); require('node:module').getCompileCacheDir()"
